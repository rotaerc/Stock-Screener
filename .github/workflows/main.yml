name: Update Stock Screener Web Page

on:
  # GitHub 시간(UTC)은 한국 시간(KST)보다 9시간 느립니다.
  # [1] 기업 리포트 전용 자동 업데이트 (약 1~2분 소요)
  #   - 08:04 KST = UTC 전날 23:04
  #   - 09:15 KST = UTC 00:15
  #   - 13:05 KST = UTC 04:05
  #   - 16:03 KST = UTC 07:03
  # [2] 코스피/코스닥 200 스크리너 전용 자동 업데이트 (약 12~15분 소요)
  #   - 08:33 KST = UTC 전날 23:33
  #   - 16:18 KST = UTC 07:18 (16:03 리포트 실행 지연 시 겹침 방지를 위해 15분 간격 확보)
  # [3] 미국 시장 거래대금·모멘텀·섹터 자금 흐름 자동 업데이트 (뉴욕 정규장 16:00 마감 + 20분 후 · 서머타임 자동 전환)
  #   - 서머타임(EDT, 3월~11월): 한국시간 05:20 KST (화~토) = UTC 월~금 20:20
  #   - 겨울 표준시(EST, 11월~3월): 한국시간 06:20 KST (화~토) = UTC 월~금 21:20
  # [4] 국내 시장 · NXT(넥스트레이드 프리/애프터마켓) · 42개 국내 섹터 강도 자동 업데이트 (평일 월~금)
  #   - 08:30 KST (NXT 프리마켓 진행 중) = UTC 일~목 23:30
  #   - 15:40 KST (정규장 마감 직후)     = UTC 월~금 06:40
  #   - 20:05 KST (NXT 애프터마켓 마감)  = UTC 월~금 11:05
  schedule:
    - cron: '20 20 * * 1-5'
    - cron: '20 21 * * 1-5'
    - cron: '30 23 * * 0-4'
    - cron: '40 6 * * 1-5'
    - cron: '5 11 * * 1-5'
    - cron: '4 23 * * *'
    - cron: '15 0 * * *'
    - cron: '5 4 * * *'
    - cron: '3 7 * * *'
    - cron: '33 23 * * *'
    - cron: '18 7 * * *'
  # [5] GitHub 웹 / 모바일 앱 / 대시보드 버튼으로 원하는 항목만 즉시 실행
  workflow_dispatch:
    inputs:
      mode:
        description: '업데이트 대상 선택'
        required: true
        default: '리포트만 (1~2분)'
        type: choice
        options:
          - '리포트만 (1~2분)'
          - '미국 시장만 (30초)'
          - '국내 시장·NXT만 (30초)'
          - '스크리너만 (13분)'
          - '전체 (리포트+스크리너+미국)'

# 리포트와 스크리너 실행이 겹치더라도 충돌 없이 순차 실행 (취소하지 않고 대기)
concurrency:
  group: stock-screener-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-screener:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 실행 모드 판별 (리포트 / 스크리너 / 전체)
        id: resolve_mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            case "$INPUT_MODE" in
              *리포트만*|reports)
                MODE="reports"
                ;;
              *미국*|us)
                MODE="us"
                ;;
              *국내*|*NXT*|kr)
                MODE="kr"
                ;;
              *스크리너만*|screener)
                MODE="screener"
                ;;
              *)
                MODE="all"
                ;;
            esac
          elif [ "$EVENT_NAME" = "schedule" ]; then
            NY_TZ=$(TZ=America/New_York date +%Z)
            case "$SCHEDULE_CRON" in
              "20 20 * * 1-5")
                # 서머타임(EDT, 05:20 KST) 기간에만 실행
                if [ "$NY_TZ" = "EDT" ]; then
                  MODE="us"
                else
                  MODE="skip"
                fi
                ;;
              "20 21 * * 1-5")
                # 겨울 표준시(EST, 06:20 KST) 기간에만 실행
                if [ "$NY_TZ" = "EST" ]; then
                  MODE="us"
                else
                  MODE="skip"
                fi
                ;;
              "30 23 * * 0-4"|"40 6 * * 1-5"|"5 11 * * 1-5")
                MODE="kr"
                ;;
              "4 23 * * *"|"15 0 * * *"|"5 4 * * *"|"3 7 * * *")
                MODE="reports"
                ;;
              "33 23 * * *"|"18 7 * * *")
                MODE="screener"
                ;;
              *)
                MODE="all"
                ;;
            esac
          else
            MODE="all"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Resolved update mode: $MODE (event=$EVENT_NAME, cron=$SCHEDULE_CRON, ny_tz=${NY_TZ:-N/A}, input=$INPUT_MODE)"

      - name: 파이썬 설치
        if: steps.resolve_mode.outputs.mode != 'skip'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필수 프로그램(라이브러리) 설치
        if: steps.resolve_mode.outputs.mode != 'skip'
        run: pip install -r requirements.txt

      - name: 리포트 또는 스크리너 업데이트 및 웹페이지 생성
        if: steps.resolve_mode.outputs.mode != 'skip'
        env:
          TZ: Asia/Seoul
          RUN_MODE: ${{ steps.resolve_mode.outputs.mode }}
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
        run: |
          if [ "$RUN_MODE" = "reports" ]; then
            echo "▶ [리포트 전용] 한경·네이버 기업 리포트 수집 및 index.html 갱신"
            python kospi200_yoy.py --reports --no-push
          elif [ "$RUN_MODE" = "us" ]; then
            echo "▶ [미국 시장 전용] 미국 거래대금·RVOL·섹터 자금 흐름 수집 및 index.html 갱신"
            python us_market.py --no-push
          elif [ "$RUN_MODE" = "kr" ]; then
            echo "▶ [국내 시장·NXT 전용] NXT 집중 매수 종목 및 국내 42개 섹터 강도 보드 갱신"
            python kr_market.py --no-push
          elif [ "$RUN_MODE" = "screener" ]; then
            if [ -n "$KOSIS_API_KEY" ]; then
              echo "▶ [통계청 KOSIS] 반도체 재고순환지표 갱신"
              python kosis_semicon.py --no-push || true
            fi
            echo "▶ [스크리너 전용] 코스피/코스닥 200 수집 및 index.html 갱신"
            python kospi200_yoy.py --screener --no-push
          else
            if [ -n "$KOSIS_API_KEY" ]; then
              echo "▶ [통계청 KOSIS] 반도체 재고순환지표 갱신"
              python kosis_semicon.py --no-push || true
            fi
            echo "▶ [미국 시장] 미국 거래대금·섹터 자금 흐름 갱신"
            python us_market.py --no-push || true
            echo "▶ [국내 시장·NXT] NXT 집중 매수 및 국내 섹터 강도 갱신"
            python kr_market.py --no-push || true
            echo "▶ [전체] 스크리너 + 기업 리포트 모두 수집 및 index.html 갱신"
            python kospi200_yoy.py --no-push
          fi

      - name: 최신 웹페이지(index.html)·데이터 GitHub 자동 저장
        if: steps.resolve_mode.outputs.mode != 'skip'
        env:
          RUN_MODE: ${{ steps.resolve_mode.outputs.mode }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html hankyung_reports.json op_estimate_history.json op_baseline.json investor_flow.json semicon_cycle.json us_market.json kr_market.json kospi_top200_latest.xlsx kosdaq_top200_latest.xlsx
          if ! git diff --staged --quiet; then
            if [ "$RUN_MODE" = "reports" ]; then
              MSG="Auto-update corporate reports"
            elif [ "$RUN_MODE" = "us" ]; then
              MSG="Auto-update US market flow & sectors"
            elif [ "$RUN_MODE" = "kr" ]; then
              MSG="Auto-update KR market & NXT"
            elif [ "$RUN_MODE" = "screener" ]; then
              MSG="Auto-update stock screener & OP history"
            else
              MSG="Auto-update stock screener, US/KR market & reports"
            fi
            git commit -m "$MSG"
            git push || (git pull --rebase --autostash origin main && git push)
          else
            echo "변경된 파일이 없어 커밋을 건너뜁니다."
          fi

      - name: 텔레그램 완료 알림 발송
        if: steps.resolve_mode.outputs.mode != 'skip'
        env:
          TZ: Asia/Seoul
          RUN_MODE: ${{ steps.resolve_mode.outputs.mode }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python telegram_notify.py "$RUN_MODE" || true
