name: Update Stock Screener Web Page

on:
  # GitHub 시간(UTC)은 한국 시간(KST)보다 9시간 느립니다.
  # 1. 매일 아침 8시 40분 (한국시간 08:40 = UTC 전날 23:40)
  # 2. 매일 오후 4시 10분 (한국시간 16:10 = UTC 07:10)
  schedule:
    - cron: '40 23 * * *'
    - cron: '10 7 * * *'
  # 3. GitHub 웹화면에서 내가 원할 때 'Run workflow' 버튼을 눌러 즉시 실행
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-screener:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필수 프로그램(라이브러리) 설치
        run: pip install -r requirements.txt

      - name: 코스피/코스닥 200 스크리너 실행 및 웹페이지(index.html) 생성
        env:
          TZ: Asia/Seoul
        run: python kospi200_yoy.py

      - name: 최신 웹페이지(index.html) 및 최신 엑셀 파일 GitHub에 자동 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html kospi_top200_latest.xlsx kosdaq_top200_latest.xlsx
          git diff --staged --quiet || git commit -m "Auto-update stock screener web page"
          git push
